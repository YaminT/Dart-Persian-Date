name: API docs

# Checks that the dartdoc API reference builds. The reference itself is built
# and served by the nodets.com site build at https://nodets.com/jalali/api/,
# from the default branch, whenever the site is rebuilt.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart doc --dry-run
