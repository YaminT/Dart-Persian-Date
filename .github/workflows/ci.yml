name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Benchmark smoke run
        run: dart run benchmark/jalali_date_benchmark.dart

  jalaali-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dart pub get
      - run: npm ci
        working-directory: tool/jalaali_sweep
      - name: Compare every day from 1850 to 2300 with jalaali-js
        run: dart run tool/jalaali_sweep/dump.dart | node tool/jalaali_sweep/sweep.mjs

  holidays:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/iranian_holidays
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  picker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jalali_calendar_picker
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/iranian_calendar_js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
